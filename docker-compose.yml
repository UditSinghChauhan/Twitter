# ╔══════════════════════════════════════════════════════════════╗
# ║  Twitter Clone — Docker Compose                             ║
# ║  Reproducible local orchestration: Postgres, Redis,         ║
# ║  GraphQL server, and Next.js client in one command.         ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Usage:
#   cp twitter-server/.env.example twitter-server/.env   # fill in values
#   cp twitter-client/.env.example twitter-client/.env   # fill in values
#   docker compose up --build
#
#   Database migrations run automatically when the server starts.

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5500:5432"
    environment:
      POSTGRES_USER: twitter_user
      POSTGRES_PASSWORD: twitter_pass
      POSTGRES_DB: twitter_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitter_user -d twitter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── GraphQL Server (Express + Apollo) ───────────────────────
  server:
    build:
      context: ./twitter-server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node build/index"
    ports:
      - "8000:8000"
    env_file:
      - ./twitter-server/.env
    environment:
      # Override DB and Redis URLs to point to Compose services
      DATABASE_URL: postgresql://twitter_user:twitter_pass@postgres:5432/twitter_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js Client ─────────────────────────────────────────
  client:
    build:
      context: ./twitter-client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/graphql
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./twitter-client/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/graphql
      # Used by getServerSideProps, which runs inside this container
      API_URL_INTERNAL: http://server:8000/graphql
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
